name: resume_maker
description: "Resume Maker / CV Builder - offline, no-backend resume builder with PDF export."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3

  # PDF generation & printing/share
  pdf: ^3.11.1
  printing: ^5.13.1

  # Images
  image_picker: ^1.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Ads (AdMob) - optional, uses test ad unit IDs by default
  google_mobile_ads: ^5.1.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
